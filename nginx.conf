server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API traffic must be routed to the backend by Coolify, never to index.html.
    location /api/ {
        default_type application/json;
        return 404 '{"message":"API route is not connected to the backend"}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
